<title>Jawabdeh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khand:wght@600;700&family=Mukta:wght@400;500;700&family=Courier+Prime:wght@400;700&family=Kalam:wght@400&display=swap">
<style>
/* Layout: a phone-width app, one question per screen (city → problem → what to do).
   Identity: India Post inland letter — pale blue lined card, post-office red, blue-black ink,
   typewriter text for official parts, handwriting for what the citizen writes, a DRAFT stamp while it is being prepared.
   The app never claims a complaint is registered: only the office's own complaint number does that. */
:root{
  --bg:#E9EEF2; --paper:#F7F9FB; --inland:#D3E4F1; --inland-line:#A9C3D9;
  --ink:#16213D; --ink-2:#4A5672; --red:#C8102E; --red-soft:#F6D9DD; --rule:#C9D3DC; --ok:#1E6B45; --warn:#9A5B00;
  --display:"Khand","Mukta",system-ui,sans-serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --type:"Courier Prime","Courier New",ui-monospace,monospace;
  --hand:"Kalam","Mukta",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1424; --paper:#141D31; --inland:#1B2B47; --inland-line:#31486D;
  --ink:#E8EDF7; --ink-2:#9DA9C2; --red:#FF5468; --red-soft:#3A1822; --rule:#2A3550; --ok:#7CD6A3; --warn:#F0BE62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1424; --paper:#141D31; --inland:#1B2B47; --inland-line:#31486D;
  --ink:#E8EDF7; --ink-2:#9DA9C2; --red:#FF5468; --red-soft:#3A1822; --rule:#2A3550; --ok:#7CD6A3; --warn:#F0BE62; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
.app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* masthead: a red postal band */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:10px 16px;background:var(--bg);
  display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--red)}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink)}
.back[hidden]{display:none}
.wordmark{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;margin-right:auto}
.wordmark i{font-style:normal;color:var(--red)}
.wordmark small{font-family:var(--type);font-size:.7rem;color:var(--ink-2);letter-spacing:.06em}
.lang{font-family:var(--type);font-weight:700;font-size:.85rem;border:2px solid var(--ink);border-radius:999px;padding:6px 12px}

/* progress as postmark dots */
.trail{display:flex;align-items:center;gap:8px;font-family:var(--type);font-size:.8rem;color:var(--ink-2)}
.trail b{width:26px;height:26px;border-radius:50%;border:2px dashed var(--ink-2);display:grid;place-items:center;font-size:.8rem}
.trail b.on{border-style:solid;border-color:var(--red);color:var(--red)}
.trail b.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.trail span{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--ink-2) 0 6px,transparent 6px 11px)}

.q{font-family:var(--display);font-weight:600;font-size:clamp(2.1rem,9vw,2.9rem);line-height:1.02;margin:6px 0 0;text-wrap:balance}
.q em{font-style:normal;color:var(--red)}
.sub{margin:0;color:var(--ink-2)}

/* step 1 */
.find{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:0 14px;box-shadow:4px 4px 0 var(--ink)}
.find{margin-bottom:6px}
@media (max-width:440px){.wordmark small{display:none}}
.find input{border:0;outline:none;background:none;font:inherit;font-size:1.1rem;padding:15px 0;width:100%;color:var(--ink)}
.recent{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--paper);text-align:left}
.recent b{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1}
.recent span{font-size:.85rem;opacity:.75}
.states{display:flex;flex-direction:column;gap:14px}
.state h3{margin:0 0 6px;font-family:var(--type);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.city{text-align:left;padding:12px 14px;border-radius:12px;background:var(--paper);border:1.5px solid var(--rule);font-weight:500;min-height:52px}
.city:hover{border-color:var(--ink)}
.none{color:var(--ink-2);font-family:var(--hand);font-size:1.1rem}

/* step 2 */
.where{font-family:var(--type);font-size:.9rem;color:var(--ink-2)}
.where b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;padding:14px;min-height:118px;border-radius:16px;background:var(--paper);
  border:1.5px solid var(--rule);transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.tile svg{width:34px;height:34px}
.tile span{font-weight:500;line-height:1.25}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tile.sos{background:var(--red-soft);border-color:var(--red)}

/* step 3 */
.head3{display:flex;flex-direction:column;gap:6px}
.typed{font-family:var(--type);font-size:.92rem;color:var(--ink-2)}
.office{font-family:var(--display);font-weight:600;font-size:clamp(1.8rem,7.5vw,2.4rem);line-height:1.05;margin:0}
.dept{font-family:var(--type);font-size:.92rem}
.alert{border-left:4px solid var(--red);background:var(--paper);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.95rem}
.alert.sos{background:var(--red);color:#fff;border-left-color:var(--ink);font-weight:700}

.section-t{display:flex;align-items:baseline;gap:10px;margin:8px 0 0}
.section-t b{font-family:var(--type);font-weight:700;font-size:.8rem;color:var(--red);letter-spacing:.06em}
.section-t h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.1}

.call{display:flex;flex-direction:column;gap:12px;background:var(--ink);color:var(--paper);border-radius:18px;padding:18px}
.call .lbl{font-size:.92rem;opacity:.85}
.call .num{font-family:var(--type);font-weight:700;font-size:clamp(1.8rem,9vw,2.4rem);line-height:1;letter-spacing:.02em;overflow-wrap:anywhere}
.call .row{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;text-decoration:none;min-height:48px}
.cbtn.red{background:var(--red);color:#fff}
.cbtn.ghost{border:2px solid currentColor;color:inherit}
.cbtn.ink{background:var(--ink);color:var(--paper)}
.cbtn.line{border:2px solid var(--ink);color:var(--ink)}
.mark{font-family:var(--type);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1.5px solid currentColor;margin-left:6px;vertical-align:2px;white-space:nowrap}
.mark.ok{color:var(--ok)} .mark.chk{color:var(--warn)}
.call .mark.ok{color:#9BE2B9} .call .mark.chk{color:#FFD58A}

/* the inland letter */
.letterwrap{perspective:1200px}
.letter{position:relative;background:var(--inland);border-radius:6px;padding:22px 18px 20px;color:var(--ink);
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,var(--inland-line) 33px 34px);background-position:0 18px;
  box-shadow:0 1px 0 var(--inland-line),0 18px 30px -18px rgba(22,33,61,.45);transform-origin:top center;line-height:34px}
.letter::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,transparent 14px 20px,var(--ink) 20px 34px,transparent 34px 40px);border-radius:6px 6px 0 0}
@media (prefers-reduced-motion:no-preference){.letter.unfold{animation:unfold .7s cubic-bezier(.2,.8,.2,1)}}
@keyframes unfold{from{transform:rotateX(-78deg);opacity:.3}to{transform:none;opacity:1}}
.letter .t{font-family:var(--type);font-size:.95rem}
.letter .to{white-space:pre-line}
.letter .subj{font-family:var(--type);font-weight:700}
.blank{font-family:var(--hand);font-size:1.15rem;color:var(--red);background:transparent;border:0;border-bottom:2px dotted var(--ink-2);
  padding:0 4px;min-width:6ch;max-width:100%;outline:none;line-height:1.4}
.blank::placeholder{color:var(--ink-2);opacity:.75}
textarea.blank{display:block;width:100%;resize:vertical;min-height:68px;border:2px dotted var(--ink-2);border-radius:6px;margin-top:6px;line-height:1.5}
.stamp{position:absolute;right:14px;top:16px;width:104px;height:104px;border-radius:50%;border:3px solid var(--red);color:var(--red);
  display:grid;place-items:center;text-align:center;font-family:var(--type);font-weight:700;font-size:.62rem;line-height:1.2;letter-spacing:.05em;
  transform:rotate(-14deg);opacity:0;pointer-events:none;filter:url(#rough);mix-blend-mode:multiply}
.stamp::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed var(--red)}
.stamp b{font-family:var(--display);font-size:1.25rem;letter-spacing:0;display:block}
:root[data-theme="dark"] .stamp{mix-blend-mode:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stamp{mix-blend-mode:normal}}
.stamp.hit{opacity:.92}
@media (prefers-reduced-motion:no-preference){.stamp.hit{animation:stamp .55s cubic-bezier(.3,1.4,.5,1)}.letter.press{animation:press .35s ease-out .12s}}
@keyframes stamp{0%{opacity:0;transform:translate(30px,-60px) rotate(-40deg) scale(2.4)}60%{opacity:.95;transform:rotate(-12deg) scale(.94)}100%{opacity:.92;transform:rotate(-14deg) scale(1)}}
@keyframes press{50%{transform:rotateX(6deg) scale(.99)}}
.sendrow{display:flex;gap:8px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:8px;font-family:var(--type);font-weight:700;font-size:.85rem;padding:8px 12px;border-radius:10px;border:2px dashed var(--ink-2);color:var(--ink-2);background:var(--paper)}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.status[data-s="copied"],.status[data-s="shared"]{border-color:var(--warn);color:var(--warn)}
.status[data-s="recorded"]{border-style:solid;border-color:var(--ok);color:var(--ok)}
.truth{border:2px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--paper);font-size:.95rem}
.truth b{color:var(--red)}
.howto{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.howto li::marker{font-family:var(--type);font-weight:700;color:var(--red)}
.hint{font-size:.88rem;color:var(--ink-2);margin:0}
.refbox{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1.5px solid var(--rule);border-radius:14px;padding:14px}
.refbox label{font-weight:700;font-size:.9rem}
.refbox input{font:inherit;font-family:var(--type);font-size:1.05rem;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);width:100%}
.refrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.refrow>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.refs li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px dashed var(--rule);padding-top:8px}
.refs .no{font-family:var(--type);font-weight:700}
.where-list{margin:0;padding-left:1.2em;font-size:.92rem;color:var(--ink-2)}

/* other ways */
.ways{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.way{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1.5px dashed var(--rule)}
.way .v{font-family:var(--type);font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.way .l{font-size:.9rem;color:var(--ink-2);grid-column:1}
.way .act{grid-row:1/3;grid-column:2;display:flex;gap:6px}
.sbtn{font-family:var(--type);font-weight:700;font-size:.8rem;padding:8px 10px;border-radius:8px;border:1.5px solid var(--ink);min-height:40px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}

/* escalation as a postal route with waiting times */
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(180deg,var(--ink-2) 0 6px,transparent 6px 11px)}
.route li{position:relative;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:8px 0}
.pm{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);display:grid;place-items:center;font-family:var(--type);font-weight:700;font-size:.72rem;line-height:1;text-align:center;z-index:1}
.route li:first-child .pm{background:var(--red);border-color:var(--red);color:#fff}
.route .wait{font-family:var(--type);font-size:.8rem;color:var(--red);font-weight:700}
.route .what{font-weight:500}
.route .det{font-size:.9rem;color:var(--ink-2)}

/* representatives */
details{background:var(--paper);border:1.5px solid var(--rule);border-radius:14px;padding:4px 16px}
summary{list-style:none;cursor:pointer;padding:12px 0;font-family:var(--display);font-weight:600;font-size:1.35rem;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--type);font-size:1.4rem;color:var(--red)}
details[open] summary::after{content:"–"}
.reps{display:flex;flex-direction:column;padding-bottom:12px}
.rep{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed var(--rule)}
.rep .s{font-family:var(--type);font-size:.85rem;color:var(--ink-2)}
.rep .n{font-weight:700;text-align:right}
.rep .n.empty{font-weight:400;font-family:var(--hand);color:var(--ink-2)}
.small{font-size:.88rem;color:var(--ink-2);margin:4px 0 12px}

footer{font-size:.85rem;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--ink);padding-top:14px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.manual{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:end center;z-index:10;padding:16px}
.mbox{width:100%;max-width:540px;background:var(--paper);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.mbox textarea{width:100%;min-height:220px;font-family:var(--type);font-size:.9rem;border:1.5px solid var(--rule);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .3s ease-out}@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media (min-width:700px){body{padding-top:20px}.cgrid{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(3,1fr)}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></svg>

<div class="app">
  <header class="mast">
    <button class="back" id="back" type="button" aria-label="Back" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5 8 12l7 7"/></svg></button>
    <div class="wordmark"><span>जवाब<i>देह</i></span><small id="tagline"></small></div>
    <button class="lang" id="lang" type="button"></button>
  </header>
  <main id="view" class="view"></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="manual" id="manual" hidden><div class="mbox"><b id="manual-t"></b><textarea id="manual-text" readonly></textarea><button class="cbtn ink" type="button" id="manual-close">OK</button></div></div>

<script>
const DATA = {"site": {"repo_url": "https://github.com/dabeeruhlaq12-cell/Jawabdeh", "maintainer": "Dabeer Ul Haq"}, "problems": {"_about": "Generic map of common civic problems to the body that is legally/operationally responsible in a typical Indian city. City files map each 'body' key to local department names and channels.", "_basis": "Municipal functions follow the 12th Schedule (74th Amendment); utilities, police and highways sit with other agencies. Always verify locally: some cities hand roads or water to a development authority or a private operator.", "problems": [{"id": "road", "en": "Pothole / damaged road", "hi": "गड्ढा / टूटी सड़क", "body": "municipal", "dept_en": "Public Works / Engineering (zone office)", "dept_hi": "लोक निर्माण / इंजीनियरिंग विभाग (ज़ोन कार्यालय)", "caveat_en": "If it is a National Highway, it is NHAI (helpline 1033). State highways belong to the State PWD. New colonies may still be under the development authority.", "caveat_hi": "नेशनल हाईवे हो तो NHAI (हेल्पलाइन 1033) ज़िम्मेदार है। स्टेट हाईवे राज्य PWD का। नई कॉलोनियाँ कभी-कभी विकास प्राधिकरण के अधीन होती हैं।"}, {"id": "water", "en": "No water / dirty water / pipeline leak", "hi": "पानी नहीं / गंदा पानी / पाइपलाइन लीक", "body": "water", "dept_en": "Water supply department", "dept_hi": "जल प्रदाय विभाग", "caveat_en": "Dirty or contaminated water is a health risk: mention smell/colour and how many houses are affected.", "caveat_hi": "गंदा पानी स्वास्थ्य के लिए ख़तरा है: रंग/बदबू और कितने घर प्रभावित हैं, ज़रूर लिखें।"}, {"id": "drain", "en": "Sewer overflow / blocked drain / waterlogging", "hi": "सीवर ओवरफ्लो / नाली जाम / जलभराव", "body": "municipal", "dept_en": "Drainage / Sewerage department", "dept_hi": "ड्रेनेज / सीवरेज विभाग"}, {"id": "garbage", "en": "Garbage not collected / dumping", "hi": "कचरा नहीं उठा / कचरा फेंका गया", "body": "municipal", "dept_en": "Solid Waste Management / Health (sanitation)", "dept_hi": "ठोस अपशिष्ट प्रबंधन / स्वास्थ्य (सफ़ाई) विभाग"}, {"id": "str   if(d.length===10&&/^[6-9]/.test(d))return d.slice(0,5)+' '+d.slice(5);
  if(d.length===11&&d[0]==='0')return d.slice(0,4)+' '+d.slice(4);return d};

/* ---------- who handles it, and through which channels ---------- */
function route(city,p){
  const st=DATA.states[city.state],muni=city.municipal;
  const nat=ids=>ids.map(NAT).filter(Boolean).map(c=>({...c,status:'verified'}));
  let who=L(muni,'name'),list=[],notes=[],primary=null;
  if(p.body==='municipal'||p.body==='water'){
    let city_=[...(muni.channels||[])];
    if(p.body==='water'&&city.water){who=L(city.water,'name');city_=[...city.water.channels,...city_]}
    (st.municipal_shared||[]).forEach(c=>{if(!city_.some(x=>x.value===c.value))city_.unshift(c)});
    if(city.dev_authority)city_=city_.concat(city.dev_authority.channels);
    if(!city_.some(c=>c.type==='phone'))notes.push({cls:'',txt:t('noNum')});
    list=[...city_,...st.grievance.channels];
    primary=city_.find(c=>c.type==='phone')||st.grievance.channels.find(c=>c.type==='phone')||st.grievance.channels[0];
    if(p.id==='road')list.push(...nat(['nhai']));
  }else if(p.body==='discom'){
    who=city.discom.name_en;
    list=[{type:'phone',value:'1912',label_en:UI.en.power,label_hi:UI.hi.power,status:'verified'},...st.grievance.channels];
  }else if(p.body==='police'){
    who=t('police');list=[...nat(['emergency','women','cyber','child']),...st.grievance.channels];
  }else if(p.body==='state'){
    who=L(st.grievance,'name');list=[...st.grievance.channels,...nat(['cpgrams'])];
  }else{
    who=t('center');list=nat(['cpgrams','rail','rti']);
  }
  if(p.id==='safety')notes.unshift({cls:'sos',txt:t('sos')});
  if(p['caveat_'+S.lang])notes.push({cls:'',txt:p['caveat_'+S.lang]});
  primary=primary||list[0];
  return {who,dept:p['dept_'+S.lang],list,primary,notes,st};
}

/* Complaint status. Only a complaint number the citizen records counts as "recorded";
   copying or sharing the draft never moves the status past "ready to send". */
function statusKey(){const r=S.city&&S.prob?latestRef(S.city,S.prob):null;return r?'recorded':(S.draft||'draft')}
function statusText(){const k=statusKey();return k==='recorded'?t('st_recorded')(latestRef(S.city,S.prob).ref):t('st_'+k)}
function setDraft(state){if(S.draft==='shared'&&state==='copied')return;S.draft=state;const el=$('status');if(el){el.dataset.s=statusKey();el.textContent=statusText()}}
const REFKEY='jawabdeh-refs';
function storageOK(){try{localStorage.setItem('__jd','1');localStorage.removeItem('__jd');return true}catch(e){return false}}
function loadRefs(){try{const a=JSON.parse(localStorage.getItem(REFKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function storeRefs(a){try{localStorage.setItem(REFKEY,JSON.stringify(a));return true}catch(e){return false}}
function refsFor(city,prob){return loadRefs().filter(r=>r.city===city&&r.prob===prob)}
function latestRef(city,prob){const a=refsFor(city,prob);return a.length?a[a.length-1]:null}
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function refsHTML(city,prob){return refsFor(city,prob).map(r=>`<li><span><span class="no">${esc(r.ref)}</span> · ${esc(niceDate(r.date))}</span><button class="sbtn" type="button" data-delref="${esc(r.id)}">${t('refDel')}</button></li>`).join('')}
function quoteHTML(city,prob){const r=latestRef(city,prob);return t('quote')+(r?` ${t('yourNo')}: <span style="font-family:var(--type)">${esc(r.ref)}</span>`:'')}
function niceDate(iso){const d=new Date(iso+'T00:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function refreshRefs(){const c=S.city,p=S.prob;const ul=$('refs');if(ul)ul.innerHTML=refsHTML(c,p);const q=$('quote');if(q)q.innerHTML=quoteHTML(c,p);setDraft(S.draft||'draft')}
function waLink(num,text){return 'https://wa.me/91'+num+'?text='+encodeURIComponent(text)}
function syncWa(){const a=$('wa');if(a)a.href='https://wa.me/?text='+encodeURIComponent(letterText());
  const o=$('owa');if(o){const n=o.href.match(/wa\.me\/91(\d{10})/);if(n)o.href=waLink(n[1],letterText())}
  const g=$('share-wa');if(g)g.href='https://wa.me/?text='+encodeURIComponent(guideText())}
function guideText(){
  const c=cityById(S.city),p=DATA.problems.problems.find(x=>x.id===S.prob),R=route(c,p);
  const lines=R.list.filter(x=>x.value).map(x=>`• ${L(x,'label')}: ${x.type==='phone'?fmt(x.value):x.value}`);
  return (S.lang==='hi'?`${L(c,'name')} – ${p.hi}\nज़िम्मेदार: ${R.who}\n\n`:`${c.name_en} – ${p.en}\nResponsible: ${R.who}\n\n`)+lines.join('\n')+
    (S.lang==='hi'?'\n\nहल न हो: ज़ोन कार्यालय → पार्षद → राज्य शिकायत प्रणाली → विधायक/सांसद → RTI':'\n\nNot fixed? Zone office → councillor → state grievance system → MLA/MP → RTI')+'\n— Jawabdeh'}

  document.documentElement.lang=S.lang;
  $('tagline').textContent=t('tag');$('lang').textContent=t('lang');$('back').hidden=S.view==='city';
  const v=$('view');v.innerHTML=S.view==='city'?vCity():S.view==='prob'?vProb():vResult();
  v.style.animation='none';void v.offsetWidth;v.style.animation='';
  if(S.view==='result')syncWa();
  $('manual-t').textContent=t('manualT');
  const repo=(DATA.site&&DATA.site.repo_url||'').replace(/\/$/,'');
  const cityName=S.city?cityById(S.city).name_en:'';
  $('foot').innerHTML=t('foot').map(x=>`<span>${x}</span>`).join('')+
    (DATA.site&&DATA.site.maintainer?`<span>${S.lang==='hi'?'ओपन-सोर्स प्रोजेक्ट':'An open-source project by'} ${esc(DATA.site.maintainer)}${S.lang==='hi'?' द्वारा':''}</span>`:'')+
    (repo?`<a href="${esc(repo)}/issues/new?template=correction.yml&title=${encodeURIComponent('[Correction] '+cityName)}" target="_blank" rel="noopener" style="color:var(--red);font-weight:700">${t('report')}</a>`:'');
  if(focusSearch){const q=$('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
function go(view,fromHistory){S.view=view;render();window.scrollTo({top:0,behavior:'auto'});
  if(!fromHistory){try{history.pushState({v:view,city:S.city,prob:S.prob},'')}catch(e){}}}
window.addEventListener('popstate',e=>{const st=e.state;if(!st){go('city',true);return}
  if(st.city)S.city=st.city;if(st.prob)S.prob=st.prob;go(st.v||'city',true)});
try{history.replaceState({v:'city'},'')}catch(e){}

let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1700)}
async function copy(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg||t('copied'));return true}
  catch(e){const box=$('manual'),ta=$('manual-text');ta.value=txt;box.hidden=false;ta.focus();ta.select();toast(t('copyFail'));return false}}
function stamp(){const s=$('stamp'),l=$('letter');if(!s)return;s.classList.remove('hit');l.classList.remove('press','unfold');void s.offsetWidth;s.classList.add('hit');l.classList.add('press')}

document.addEventListener('click',e=>{
  const a=e.target.closest('#wa,#owa');if(a){setDraft('shared');stamp();return}
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='lang'){S.lang=S.lang==='hi'?'en':'hi';save();render()}
  else if(b.id==='back'){if(history.state&&history.state.v&&history.state.v!=='city')history.back();else go(S.view==='result'?'prob':'city')}
  else if(b.dataset.city){S.city=b.dataset.city;last=S.city;S.q='';save();go('prob')}
  else if(b.dataset.go){go(b.dataset.go)}
  else if(b.dataset.prob){S.prob=b.dataset.prob;S.draft='draft';go('result')}
  else if(b.dataset.copy){copy(b.dataset.copy)}
  else if(b.id==='cp'){copy(letterText(),t('st_copied')).then(ok=>{if(ok){setDraft('copied');stamp()}})}
  else if(b.dataset.delref){storeRefs(loadRefs().filter(r=>r.id!==b.dataset.delref));refreshRefs()}
  else if(b.id==='manual-close'){$('manual').hidden=true}
  else if(b.id==='share'){copy(guideText())}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;
    const st=$('states');const tmp=document.createElement('div');tmp.innerHTML=vCity();st.replaceWith(tmp.querySelector('#states'));
    const rc=document.querySelector('.recent');if(rc)rc.hidden=!!S.q.trim();return}
  const k={'f-loc':'loc','f-since':'since','f-det':'det','f-name':'name'}[e.target.id];if(k){S[k]=e.target.value.trim();syncWa();if(S.draft==='copied')setDraft('draft')}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='refform')return;e.preventDefault();
  const ref=($('f-ref').value||'').trim().slice(0,40),date=$('f-refdate').value||todayISO();
  if(!ref){toast(t('refNeed'));$('f-ref').focus();return}
  const a=loadRefs();a.push({id:Date.now().toString(36),city:S.city,prob:S.prob,ref,date});
  if(storeRefs(a)){toast(t('refSaved'));$('f-ref').value='';refreshRefs()}else toast(t('refNoStore'));
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){const f=document.querySelector('#states .city');if(f)f.click()}});
render();
</script>
